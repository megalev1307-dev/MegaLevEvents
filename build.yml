name: Build MegaLevEvents
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile plugin
        run: |
          mkdir -p build/classes
          javac -encoding UTF-8 -cp paper-api.jar -d build/classes src/main/java/fun/megalev/events/MegaLevEvents.java
          cp -R src/main/resources/. build/classes/
          jar --create --file MegaLevEvents.jar -C build/classes .
      - uses: actions/upload-artifact@v4
        with:
          name: MegaLevEvents-Paper26.2
          path: MegaLevEvents.jar
